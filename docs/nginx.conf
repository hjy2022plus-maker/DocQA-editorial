# 以下为前端编译发布后nginx配置的相关代码片段
server {
  listen 8080;

  location / {
    # root D:/PaiSmart/frontend/dist;
    root html;
    index index.html index.htm;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8081;
  }

