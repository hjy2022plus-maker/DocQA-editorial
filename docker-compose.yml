name: paismart

services:
  mysql:
    image: mysql:8.0
    container_name: paismart-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-paismart}
      MYSQL_DATABASE: PaiSmart
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: paismart-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: paismart-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # 容器内用 kafka:29092；宿主机工具用 localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: paismart-elasticsearch:8.10.4-ik
    container_name: paismart-es
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-paismart}
      discovery.type: single-node
      node.name: paismart-es01
      cluster.name: paismart-es-cluster
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    # MinIO 官方 Docker Hub 仓库已下架，这里使用 Bitnami 归档镜像
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    container_name: paismart-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # 首次启动自动创建 uploads 桶
      MINIO_DEFAULT_BUCKETS: uploads
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: paismart-backend:latest
    container_name: paismart-backend
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      APP_TIMEZONE: Asia/Shanghai

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/PaiSmart?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-paismart}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # compose 里的 Redis 未启用密码
      SPRING_DATA_REDIS_PASSWORD: ""

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_TOPIC_PARTITIONS: 1
      SPRING_KAFKA_TOPIC_REPLICATION_FACTOR: 1

      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: uploads

      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-paismart}
      ELASTICSEARCH_INSECURE_TRUST_ALL_CERTIFICATES: "true"

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

      # 首次启动创建管理员；密码来自 .env 的 ADMIN_BOOTSTRAP_PASSWORD
      ADMIN_BOOTSTRAP_ENABLED: ${DOCKER_ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-PaiSmart@2025}
      ADMIN_BOOTSTRAP_PRIMARY_ORG: ${ADMIN_BOOTSTRAP_PRIMARY_ORG:-default}
      ADMIN_BOOTSTRAP_ORG_TAGS: ${ADMIN_BOOTSTRAP_ORG_TAGS:-default,admin}

      KNOWLEDGE_BOOTSTRAP_ENABLED: "false"

      # 容器内 localhost 指向容器自身，本机 Ollama 改为 host.docker.internal
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL_DOCKER:-http://host.docker.internal:11434/v1}
      # 文本型 PDF 足够用；需要 OCR 时再打开并挂载 tessdata
      FILE_PARSING_LITEPARSE_OCR_ENABLED: "false"
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    develop:
      watch:
        # 源码/依赖变更时自动重建后端镜像并重启容器
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./pom.xml
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
    image: paismart-frontend:latest
    container_name: paismart-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9527:80"
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules
            - dist
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  es-data:
  minio-data:
